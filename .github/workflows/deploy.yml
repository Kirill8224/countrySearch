name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Укажите master, если ваша главная ветка называется так

# Разрешаем скрипту перезаписывать содержимое GitHub Pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-level: 20 # Или другая версия Node.js, которую вы используете
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Папка, куда Vite собирает готовый проект
          branch: gh-pages # Ветка, куда отправятся файлы для сайта
